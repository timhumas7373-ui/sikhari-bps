<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIKHARI BPS | Kegiatan Harian Pegawai</title>
<style>
:root{--navy:#173d70;--blue:#2367a5;--pale:#eef5fc;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--green:#168653;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:66px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #102b4a30}.brand{display:flex;gap:12px;align-items:center;font-weight:750;letter-spacing:.2px}.brandmark{width:36px;height:36px;border:1px solid #ffffff80;border-radius:10px;display:grid;place-items:center;font-weight:800}.top small{display:block;font-weight:400;color:#dbeafe;font-size:11px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 66px)}aside{background:white;border-right:1px solid var(--line);padding:20px 13px}.navlabel{font-size:10px;font-weight:800;letter-spacing:1px;color:#94a3b8;padding:12px 12px 7px}.nav{width:100%;border:0;background:transparent;color:#475569;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;display:flex;gap:11px;align-items:center;font-size:13px}.nav.active,.nav:hover{background:var(--pale);color:var(--blue);font-weight:700}.nav .ico{width:19px;text-align:center}.sidefoot{margin:25px 8px 0;color:#94a3b8;font-size:11px;line-height:1.5}main{padding:26px;max-width:1500px;width:100%;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{font-size:23px;margin:0 0 5px;color:#183b63}.sub{font-size:13px;color:var(--muted)}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font-weight:650;font-size:12px}.btn.secondary{background:white;color:var(--blue);border:1px solid #cbdced}.btn.ghost{background:#f1f5f9;color:#475569}.btn.danger{background:#fff1f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #0f172a06}.metric{font-size:27px;font-weight:800;color:#173d70;margin:8px 0 2px}.metriclabel{font-size:12px;color:var(--muted)}.metricicon{float:right;background:var(--pale);color:var(--blue);padding:8px;border-radius:9px}.panel h3{font-size:15px;margin:0 0 14px;color:#1e3a5f}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;background:#f7f9fc;color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.45px;padding:11px 10px;white-space:nowrap}td{padding:11px 10px;border-top:1px solid #edf1f5;vertical-align:top}tr:hover td{background:#fbfdff}.pill{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;background:#eaf7f0;color:#16734a;font-weight:700}.pill.gray{background:#f1f5f9;color:#64748b}.pill.yellow{background:#fff7e6;color:#996300}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid #d9e2ec;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);font-size:12px;width:100%}.field textarea{min-height:90px;resize:vertical}.hint{font-size:10px;color:#94a3b8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters>*{max-width:220px}.empty{text-align:center;padding:32px;color:#94a3b8;font-size:13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dayhead{text-align:center;font-size:10px;color:#64748b;padding:7px}.day{background:#fbfdff;border:1px solid var(--line);border-radius:7px;min-height:68px;padding:7px;font-size:11px}.day.has{background:#edf8f1;border-color:#b7e2c9}.day b{display:block;margin-bottom:5px}.bar{height:7px;background:#e8eef5;border-radius:10px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#2e8b62}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#173d70;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 6px 24px #0002;font-size:12px;z-index:20}.profile{font-size:11px;color:#dbeafe}.filelist{font-size:11px;color:#64748b}.reporthead{text-align:center;border-bottom:2px solid #243b53;padding-bottom:12px;margin-bottom:16px}.reporthead h2{font-size:17px;margin:0 0 4px}.reporthead p{margin:0;font-size:11px}.reportmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin:14px 0}.signatures{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:55px;font-size:12px}.signatures div{min-height:85px}.mobiletoggle{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:8px;gap:5px;border-right:0;border-bottom:1px solid var(--line)}.navlabel,.sidefoot{display:none}.nav{white-space:nowrap;width:auto;margin:0;padding:9px}.top{padding:0 14px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}main{padding:18px 13px}.pagehead{align-items:center}.pagehead h1{font-size:20px}}
@media(max-width:520px){.cards{gap:8px}.card{padding:12px}.metric{font-size:22px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top .profile{display:none}.pagehead{display:block}.pagehead .btn{margin-top:12px}}
@media print{body{background:white}.top,aside,.no-print,.pagehead,.toast{display:none!important}.layout{display:block}main{padding:0;max-width:none}.print-area{display:block!important}.panel{border:0;box-shadow:none;padding:0}.reporthead{margin-top:0}table{font-size:10px}th,td{padding:7px 6px}.signatures{break-inside:avoid}.reportmeta{font-size:11px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="brandmark">BPS</div><div>SIKHARI BPS<small>Sistem Informasi Kegiatan Harian Pegawai · BPS Kota Palopo</small></div></div><div class="profile" id="topUser">Mode demo · Admin</div></header><div class="layout"><aside>
<div class="navlabel">MENU UTAMA</div>
<button class="nav active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
<button class="nav" data-page="input"><span class="ico">＋</span>Input Kegiatan</button>
<button class="nav" data-page="history"><span class="ico">☷</span>Riwayat Kegiatan</button>
<button class="nav" data-page="employees"><span class="ico">♙</span>Data Pegawai</button>
<button class="nav" data-page="reports"><span class="ico">▤</span>Laporan PDF</button>
<button class="nav" data-page="recap"><span class="ico">▥</span>Rekap Bulanan/Tahunan</button>
<div class="navlabel">PENGELOLAAN</div><button class="nav" data-page="backup"><span class="ico">⚙</span>Data & Cadangan</button>
<div class="sidefoot">Prototype web app SIKHARI BPS<br>Data demo tersimpan di browser perangkat ini.</div>
</aside><main id="main"></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const seedNames=['Nurmiati Amir','Herbian Dwi Cahyo','Nasirah','Andi Muhammad Rafly','Nurhuda','Ardian Wahyu','Karnadi'];
const KEY='sikhari_bps_v1';let state=load();let currentPage='dashboard';let editingId=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}return {employees:seedNames.map((n,i)=>({id:i+1,name:n,nip:'',position:'',unit:'Sub Bagian Umum',status:'Aktif'})),activities:[],nextEmp:8,nextAct:1}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}function today(){return new Date().toISOString().slice(0,10)}function emp(id){return state.employees.find(e=>e.id==id)||{name:'Pegawai tidak ditemukan',nip:''}}function fmt(d){if(!d)return '-';let x=new Date(d+'T00:00:00');return x.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}function monthName(m){return new Date(2000,m-1,1).toLocaleDateString('id-ID',{month:'long'})}function setPage(p){currentPage=p;editingId=null;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function pageHead(title,sub,btn=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${btn}</div>`}
function render(){let m=document.getElementById('main');if(currentPage==='dashboard')m.innerHTML=dashboard();if(currentPage==='input')m.innerHTML=inputPage();if(currentPage==='history')m.innerHTML=historyPage();if(currentPage==='employees')m.innerHTML=employeesPage();if(currentPage==='reports')m.innerHTML=reportsPage();if(currentPage==='recap')m.innerHTML=recapPage();if(currentPage==='backup')m.innerHTML=backupPage();bind()}
function dashboard(){let now=new Date(),ym=today().slice(0,7),acts=state.activities.filter(a=>a.date.startsWith(ym)),todayN=state.activities.filter(a=>a.date===today()).length,done=acts.filter(a=>a.status==='Selesai').length;let recent=[...state.activities].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);let filled=new Set(acts.map(a=>a.empId)).size;return pageHead('Dashboard','Ringkasan kegiatan harian pegawai BPS Kota Palopo',`<button class="btn" data-go="input">＋ Input Kegiatan</button>`)+`<div class="cards"><div class="card"><span class="metricicon">♙</span><div class="metric">${state.employees.length}</div><div class="metriclabel">Pegawai terdaftar</div></div><div class="card"><span class="metricicon">▤</span><div class="metric">${acts.length}</div><div class="metriclabel">Kegiatan bulan ini</div></div><div class="card"><span class="metricicon">✓</span><div class="metric">${done}</div><div class="metriclabel">Kegiatan selesai bulan ini</div></div><div class="card"><span class="metricicon">▣</span><div class="metric">${filled}/${state.employees.length}</div><div class="metriclabel">Pegawai yang sudah mengisi bulan ini</div></div></div><div class="grid2"><section class="panel"><h3>Kegiatan Terbaru</h3>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Pegawai</th><th>Kegiatan dan Output</th><th>Status</th></tr></thead><tbody>${recent.map(a=>`<tr><td>${fmt(a.date)}</td><td>${esc(emp(a.empId).name)}</td><td>${esc(a.title)}</td><td><span class="pill ${a.status==='Selesai'?'':'yellow'}">${esc(a.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada kegiatan yang diinput.</div>'}</section><section class="panel"><h3>Monitoring Pengisian Bulan Ini</h3><div class="sub">${monthName(now.getMonth()+1)} ${now.getFullYear()}</div>${state.employees.map(e=>{let n=acts.filter(a=>a.empId==e.id).length;return `<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(e.name)}</b><span>${n} kegiatan</span></div><div class="bar"><span style="width:${n?100:0}%"></span></div></div>`}).join('')}</section></div>`}
function inputPage(){let a=state.activities.find(x=>x.id===editingId)||{};return pageHead(editingId?'Edit Kegiatan':'Input Kegiatan Harian','Catat kegiatan dan output pekerjaan. Tidak menggunakan kolom jam.')+`<section class="panel"><form id="activityForm"><div class="formgrid"><div class="field"><label>Nama Pegawai *</label><select name="empId" required>${state.employees.map(e=>`<option value="${e.id}" ${a.empId==e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal Kegiatan *</label><input type="date" name="date" value="${a.date||today()}" required></div><div class="field full"><label>Kegiatan dan Output Kegiatan *</label><textarea name="title" required placeholder="Tuliskan kegiatan dan hasil/output pekerjaan...">${esc(a.title||'')}</textarea><span class="hint">Ikuti format laporan Excel yang digunakan saat ini. Satu tanggal dapat memiliki lebih dari satu entri kegiatan.</span></div><div class="field"><label>Keterangan (Garis Besar)</label><textarea name="note" placeholder="Keterangan tambahan...">${esc(a.note||'')}</textarea></div><div class="field"><label>Persentase (%)</label><input type="number" name="percent" min="0" max="100" placeholder="Opsional" value="${a.percent??''}"></div><div class="field"><label>Status Kegiatan</label><select name="status"><option ${a.status==='Selesai'?'selected':''}>Selesai</option><option ${a.status==='Dalam Proses'?'selected':''}>Dalam Proses</option></select></div><div class="field"><label>Link Bukti Dukung (opsional)</label><input name="link" type="url" placeholder="https://..." value="${esc(a.link||'')}"></div><div class="field full"><label>Upload Dokumentasi (opsional)</label><input name="files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xlsx"><span class="hint">Prototype ini menyimpan file kecil di browser perangkat. Untuk penggunaan kantor bersama diperlukan server dan penyimpanan terpusat.</span><div class="filelist">${a.files?.map(f=>esc(f.name)).join(' · ')||''}</div></div></div><div class="actions"><button class="btn" type="submit">${editingId?'Simpan Perubahan':'Simpan Kegiatan'}</button><button class="btn secondary" type="button" data-go="history">Batal</button></div></form></section>`}
function historyPage(){return pageHead('Riwayat Kegiatan','Daftar kegiatan yang telah diinput')+`<section class="panel"><div class="filters"><input id="qHistory" placeholder="Cari kegiatan / pegawai..."><input id="fDate" type="month" value="${today().slice(0,7)}"><select id="fEmp"><option value="">Semua pegawai</option>${state.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><button class="btn secondary" id="clearFilters">Reset</button></div><div id="historyTable"></div></section>`}
function drawHistory(){let q=(document.getElementById('qHistory')?.value||'').toLowerCase(),mo=document.getElementById('fDate')?.value||'',ei=document.getElementById('fEmp')?.value||'';let rows=[...state.activities].filter(a=>(!mo||a.date.startsWith(mo))&&(!ei||a.empId==ei)&&(`${a.title} ${a.note} ${emp(a.empId).name}`.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('historyTable').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Pegawai</th><th>Kegiatan dan Output</th><th>Keterangan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${fmt(a.date)}</td><td>${esc(emp(a.empId).name)}</td><td>${esc(a.title).replace(/\n/g,'<br>')}</td><td>${esc(a.note||'-')}</td><td><span class="pill ${a.status==='Selesai'?'':'yellow'}">${esc(a.status)}</span></td><td><button class="btn small secondary" data-edit="${a.id}">Edit</button> <button class="btn small danger" data-delete="${a.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada data yang sesuai.</div>';bindRowActions()}
function employeesPage(){return pageHead('Data Pegawai','Kelola daftar pegawai yang dapat mengisi kegiatan',`<button class="btn" id="addEmp">＋ Tambah Pegawai</button>`)+`<section class="panel"><div class="tablewrap"><table><thead><tr><th>Nama Pegawai</th><th>NIP</th><th>Jabatan</th><th>Unit Kerja</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${state.employees.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.nip||'-')}</td><td>${esc(e.position||'-')}</td><td>${esc(e.unit||'-')}</td><td><span class="pill">${esc(e.status)}</span></td><td><button class="btn small secondary" data-editemp="${e.id}">Edit</button> <button class="btn small danger" data-delemp="${e.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div></section><div id="empModal" class="hidden"></div>`}
function reportsPage(){return pageHead('Laporan PDF','Cetak laporan kegiatan per pegawai berdasarkan periode')+`<section class="panel no-print"><div class="formgrid"><div class="field"><label>Pegawai</label><select id="reportEmp">${state.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Jenis Periode</label><select id="reportType"><option value="month">Bulanan</option><option value="year">Tahunan</option><option value="range">Rentang tanggal</option></select></div><div class="field" id="reportMonthField"><label>Bulan</label><input type="month" id="reportMonth" value="${today().slice(0,7)}"></div><div class="field hidden" id="reportYearField"><label>Tahun</label><input type="number" id="reportYear" value="${new Date().getFullYear()}"></div><div class="field hidden" id="reportRangeField"><label>Dari tanggal</label><input type="date" id="reportFrom" value="${today()}"></div><div class="field hidden" id="reportToField"><label>Sampai tanggal</label><input type="date" id="reportTo" value="${today()}"></div></div><div class="actions"><button class="btn" id="previewReport">Tampilkan Pratinjau</button><button class="btn secondary" id="printReport">Cetak / Simpan PDF</button></div><p class="hint">Pada dialog cetak browser, pilih tujuan “Save as PDF”. Jam kegiatan tidak ditampilkan.</p></section><section class="panel" style="margin-top:14px"><div id="reportPreview" class="print-area"><div class="empty">Pilih pegawai dan periode, lalu tampilkan pratinjau laporan.</div></div></section>`}
function reportHtml(){let id=+document.getElementById('reportEmp').value,e=emp(id),type=document.getElementById('reportType').value,from,to,label;if(type==='month'){let v=document.getElementById('reportMonth').value;from=v+'-01';to=v+'-31';label=monthName(+v.slice(5))+' '+v.slice(0,4)}else if(type==='year'){let y=document.getElementById('reportYear').value;from=y+'-01-01';to=y+'-12-31';label='Tahun '+y}else{from=document.getElementById('reportFrom').value;to=document.getElementById('reportTo').value;label=fmt(from)+' s.d. '+fmt(to)}let rows=state.activities.filter(a=>a.empId==id&&a.date>=from&&a.date<=to).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="reporthead"><h2>BADAN PUSAT STATISTIK</h2><p><b>KOTA PALOPO</b></p><p style="margin-top:12px;font-weight:bold">LAPORAN KEGIATAN HARIAN PEGAWAI</p><p>Periode: ${esc(label)}</p></div><div class="reportmeta"><div><b>Nama Pegawai:</b> ${esc(e.name)}</div><div><b>NIP:</b> ${esc(e.nip||'-')}</div><div><b>Jabatan:</b> ${esc(e.position||'-')}</div><div><b>Unit Kerja:</b> ${esc(e.unit||'-')}</div></div><table><thead><tr><th style="width:35px">No.</th><th style="width:105px">Hari, Tanggal</th><th>Kegiatan dan Output Kegiatan</th><th>Keterangan (Garis Besar)</th><th style="width:65px">Persentase</th><th>Link Bukti Dukung</th></tr></thead><tbody>${rows.length?rows.map((a,i)=>`<tr><td>${i+1}</td><td>${fmt(a.date)}</td><td>${esc(a.title).replace(/\n/g,'<br>')}</td><td>${esc(a.note||'-').replace(/\n/g,'<br>')}</td><td>${a.percent==null||a.percent===''?'-':esc(a.percent)+'%'}</td><td>${a.link?`<a href="${esc(a.link)}">Bukti dukung</a>`:'-'}</td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:24px">Belum ada kegiatan pada periode ini.</td></tr>'}</tbody></table><div style="font-size:10px;color:#64748b;margin-top:10px">Jumlah kegiatan: ${rows.length}</div><div class="signatures"><div>Mengetahui,<br>Atasan Langsung<br><br><br><b>(................................)</b></div><div>Palopo, ${fmt(today())}<br>Pegawai yang bersangkutan<br><br><br><b>(${esc(e.name)})</b></div></div>`}
function recapPage(){return pageHead('Rekapitulasi Kegiatan','Pantau jumlah kegiatan per pegawai dan per periode')+`<section class="panel"><div class="filters"><select id="recapType"><option value="month">Rekap Bulanan</option><option value="year">Rekap Tahunan</option></select><input type="month" id="recapMonth" value="${today().slice(0,7)}"><input type="number" id="recapYear" class="hidden" value="${new Date().getFullYear()}"><button class="btn" id="runRecap">Tampilkan Rekap</button></div><div id="recapResult"></div></section>`}
function drawRecap(){let type=document.getElementById('recapType').value,mo=document.getElementById('recapMonth').value,y=document.getElementById('recapYear').value;let data=state.employees.map(e=>{let a=state.activities.filter(x=>x.empId==e.id&&(type==='month'?x.date.startsWith(mo):x.date.startsWith(y)));return {e,n:a.length,done:a.filter(x=>x.status==='Selesai').length,progress:a.filter(x=>x.status==='Dalam Proses').length}});document.getElementById('recapResult').innerHTML=`<div class="sub" style="margin:12px 0">${type==='month'?monthName(+mo.slice(5))+' '+mo.slice(0,4):'Tahun '+y}</div><div class="cards"><div class="card"><div class="metric">${data.reduce((s,x)=>s+x.n,0)}</div><div class="metriclabel">Total kegiatan</div></div><div class="card"><div class="metric">${data.filter(x=>x.n>0).length}</div><div class="metriclabel">Pegawai mengisi</div></div><div class="card"><div class="metric">${data.reduce((s,x)=>s+x.done,0)}</div><div class="metriclabel">Kegiatan selesai</div></div><div class="card"><div class="metric">${data.reduce((s,x)=>s+x.progress,0)}</div><div class="metriclabel">Dalam proses</div></div></div><div class="tablewrap"><table><thead><tr><th>Pegawai</th><th>Jumlah Kegiatan</th><th>Selesai</th><th>Dalam Proses</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.e.name)}</td><td>${x.n}</td><td>${x.done}</td><td>${x.progress}</td></tr>`).join('')}</tbody></table></div>`}
function backupPage(){return pageHead('Data & Cadangan','Simpan salinan data atau pulihkan data aplikasi')+`<section class="panel"><h3>Cadangkan Data</h3><p class="sub">Unduh seluruh data pegawai dan kegiatan dalam format JSON agar dapat dipindahkan atau dipulihkan.</p><div class="actions"><button class="btn" id="exportData">Unduh Cadangan JSON</button><button class="btn secondary" id="exportCsv">Unduh Kegiatan CSV</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Pulihkan Data</h3><div class="field"><label>Pilih file cadangan JSON</label><input type="file" id="importFile" accept=".json,application/json"></div><div class="actions"><button class="btn secondary" id="importData">Pulihkan Cadangan</button></div><p class="hint">Peringatan: pemulihan akan mengganti data yang saat ini tersimpan pada browser ini.</p></section><section class="panel" style="margin-top:14px"><h3>Informasi Prototype</h3><p class="sub">Versi unduhan ini berjalan langsung di browser dan menyimpan data pada perangkat yang digunakan (localStorage). Untuk digunakan bersama oleh seluruh pegawai melalui internet/jaringan kantor, aplikasi perlu dipasang pada server dengan database MySQL, sistem login terautentikasi, dan penyimpanan dokumen terpusat.</p></section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));let f=document.getElementById('activityForm');if(f)f.onsubmit=async ev=>{ev.preventDefault();let fd=new FormData(f),files=[...(f.elements.files.files||[])];let old=editingId!==null?state.activities.find(x=>x.id===editingId):null;if(editingId!==null&&!old){toast('Data yang akan diedit tidak ditemukan. Silakan kembali ke riwayat kegiatan.');return}let fileData=old?.files||[];for(let file of files){if(file.size>900000){toast('Ukuran file maksimal 900 KB per file pada prototype.');return}let data=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});fileData.push({name:file.name,type:file.type,data})}let obj={id:editingId||state.nextAct++,empId:+fd.get('empId'),date:fd.get('date'),title:fd.get('title').trim(),note:fd.get('note'),percent:fd.get('percent'),status:fd.get('status'),link:fd.get('link'),files:fileData};if(editingId){state.activities=state.activities.map(x=>x.id===editingId?obj:x)}else state.activities.push(obj);save();toast(editingId!==null?'Perubahan kegiatan berhasil disimpan.':'Kegiatan baru berhasil ditambahkan.');setPage('history')};if(currentPage==='history'){['qHistory','fDate','fEmp'].forEach(id=>document.getElementById(id).addEventListener(id==='qHistory'?'input':'change',drawHistory));document.getElementById('clearFilters').onclick=()=>{document.getElementById('qHistory').value='';document.getElementById('fDate').value='';document.getElementById('fEmp').value='';drawHistory()};drawHistory()}if(currentPage==='employees'){document.getElementById('addEmp').onclick=()=>employeeDialog();document.querySelectorAll('[data-editemp]').forEach(b=>b.onclick=()=>employeeDialog(+b.dataset.editemp));document.querySelectorAll('[data-delemp]').forEach(b=>b.onclick=()=>{let id=+b.dataset.delemp;if(confirm('Hapus pegawai dan seluruh kegiatan terkait?')){state.employees=state.employees.filter(e=>e.id!==id);state.activities=state.activities.filter(a=>a.empId!==id);save();render()}})}if(currentPage==='reports'){document.getElementById('reportType').onchange=()=>{let t=document.getElementById('reportType').value;document.getElementById('reportMonthField').classList.toggle('hidden',t!=='month');document.getElementById('reportYearField').classList.toggle('hidden',t!=='year');document.getElementById('reportRangeField').classList.toggle('hidden',t!=='range');document.getElementById('reportToField').classList.toggle('hidden',t!=='range')};document.getElementById('previewReport').onclick=()=>document.getElementById('reportPreview').innerHTML=reportHtml();document.getElementById('printReport').onclick=()=>{document.getElementById('reportPreview').innerHTML=reportHtml();window.print()}}if(currentPage==='recap'){document.getElementById('recapType').onchange=()=>{let t=document.getElementById('recapType').value;document.getElementById('recapMonth').classList.toggle('hidden',t!=='month');document.getElementById('recapYear').classList.toggle('hidden',t!=='year')};document.getElementById('runRecap').onclick=drawRecap;drawRecap()}if(currentPage==='backup'){document.getElementById('exportData').onclick=()=>download('sikhari-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');document.getElementById('exportCsv').onclick=()=>{let rows=[['Nama Pegawai','NIP','Tanggal','Kegiatan dan Output Kegiatan','Keterangan','Persentase','Status','Link Bukti Dukung'],...state.activities.map(a=>[emp(a.empId).name,emp(a.empId).nip,a.date,a.title,a.note,a.percent,a.status,a.link])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('sikhari-kegiatan-'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')};document.getElementById('importData').onclick=()=>{let file=document.getElementById('importFile').files[0];if(!file){toast('Pilih file JSON terlebih dahulu.');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.employees||!x.activities)throw Error();if(confirm('Ganti data browser dengan isi cadangan?')){state=x;save();toast('Cadangan berhasil dipulihkan.');render()}}catch(e){toast('File cadangan tidak valid.')}};r.readAsText(file)}}}
function bindRowActions(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.edit);if(!state.activities.some(a=>a.id===id)){toast('Data kegiatan tidak ditemukan.');return}editingId=id;currentPage='input';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='input'));render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let id=+b.dataset.delete;if(confirm('Hapus kegiatan ini?')){state.activities=state.activities.filter(a=>a.id!==id);save();drawHistory()}})}
function employeeDialog(id){let e=id?state.employees.find(x=>x.id===id):{};let box=document.getElementById('empModal');box.classList.remove('hidden');box.innerHTML=`<div style="position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:15px;z-index:10"><form id="empForm" class="panel" style="width:min(480px,100%)"><h3>${id?'Edit':'Tambah'} Data Pegawai</h3><div class="formgrid"><div class="field full"><label>Nama Pegawai *</label><input name="name" required value="${esc(e.name||'')}"></div><div class="field"><label>NIP</label><input name="nip" value="${esc(e.nip||'')}"></div><div class="field"><label>Jabatan</label><input name="position" value="${esc(e.position||'')}"></div><div class="field"><label>Unit Kerja</label><input name="unit" value="${esc(e.unit||'Sub Bagian Umum')}"></div><div class="field"><label>Status</label><select name="status"><option>Aktif</option><option ${e.status==='Nonaktif'?'selected':''}>Nonaktif</option></select></div></div><div class="actions"><button class="btn">Simpan</button><button type="button" class="btn secondary" id="closeEmp">Batal</button></div></form></div>`;document.getElementById('closeEmp').onclick=()=>box.classList.add('hidden');document.getElementById('empForm').onsubmit=ev=>{ev.preventDefault();let fd=new FormData(ev.target),obj={id:id||state.nextEmp++,name:fd.get('name'),nip:fd.get('nip'),position:fd.get('position'),unit:fd.get('unit'),status:fd.get('status')};if(id)state.employees=state.employees.map(x=>x.id===id?obj:x);else state.employees.push(obj);save();render()}}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
render();
</script></body></html>
